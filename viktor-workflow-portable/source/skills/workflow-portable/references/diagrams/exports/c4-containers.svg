<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">C4 containers: async order processing</title><desc id="desc">Which applications and stores own each responsibility? | Solid arrow: labeled relationship; dashed frame: explicit boundary; example only</desc><metadata>{"model_id": "c4-containers", "source_sha256": "0dfe2a58c0eb81b9503586522d906a1a832e7cd206af17cf2daff6b360925b4f", "exporter": "original offline SVG; not a third-party engine render"}</metadata><rect width="1100" height="700" fill="#FFFFFF" /><text x="24" y="29" font-family="Arial, sans-serif" font-size="19" text-anchor="start" fill="#172B4D">C4 containers: async order processing</text><text x="24" y="51" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">SYNTHETIC REFERENCE | C4 container</text><rect x="190" y="90" width="820" height="430" rx="8" fill="#F4F7FB" stroke="#8395AA" stroke-dasharray="6 4" /><text x="202" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#172B4D">Order system boundary</text><g data-node-id="person"><rect x="30" y="300" width="120" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="90.0" y="336.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Customer</text></g><g data-node-id="web"><rect x="220" y="160" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="295.0" y="189.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Web application</text><text x="295.0" y="204.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">[Browser]</text></g><g data-node-id="api"><rect x="450" y="160" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="525.0" y="189.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middl