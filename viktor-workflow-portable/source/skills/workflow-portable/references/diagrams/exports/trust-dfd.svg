<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Data flow and trust boundaries</title><desc id="desc">Where does classified data cross a trust boundary? | Named process/entity/store roles; arrows are classified data flows; dashed frames are trust boundaries</desc><metadata>{"model_id": "trust-dfd", "source_sha256": "ffb1ed0aa9144da30398b3a748235dac1e613517cdfaa9b2fb2b13d392646c71", "exporter": "original offline SVG; not a third-party engine render"}</metadata><rect width="1100" height="700" fill="#FFFFFF" /><text x="24" y="29" font-family="Arial, sans-serif" font-size="19" text-anchor="start" fill="#172B4D">Data flow and trust boundaries</text><text x="24" y="51" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">SYNTHETIC REFERENCE | DFD with labeled trust zones</text><rect x="205" y="100" width="220" height="245" rx="8" fill="#F4F7FB" stroke="#8395AA" stroke-dasharray="6 4" /><text x="217" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#172B4D">Edge trust boundary</text><rect x="480" y="100" width="560" height="245" rx="8" fill="#F4F7FB" stroke="#8395AA" stroke-dasharray="6 4" /><text x="492" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#172B4D">Application/data trust boundary</text><rect x="480" y="365" width="300" height="225" rx="8" fill="#F4F7FB" stroke="#8395AA" stroke-dasharray="6 4" /><text x="492" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#172B4D">Separate audit trust boundary</text><g data-node-id="actor"><rect x="30" y="190" width="145" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="102.5" y="219.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">External user</text><text x="102.5" y="234.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">[Entity]</text></g><g data-node-id="gateway"><rect x="230" y="190" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="305.0" y="219.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Gateway</text><text x="305.0" y="234.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">[Process]</text></g><g data-node-id="processor"><rect x="520" y="190" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="595.0" y="219.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Order processing</text><text x="595.0" y="234.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">[Process]</text></g><g data-node-id="store"><rect x="800" y="190" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="875.0" y="219.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Order records</text><text x="875.0" y="234.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">[Data store]</text></g><g data-node-id="audit_store"><rect x="520" y="420" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="595.0" y="449.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Audit metadata</text><text x="595.0" y="464.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">[Data store]</text></g><polyline points="175,222.0 230,222.0" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="input" /><polygon points="221.0,218.0 230,222.0 221.0,226.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="input" /><text x="202.5" y="178" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">Untrusted order input</text><polyline points="380,222.0 520,222.0" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="validated" /><polygon points="511.0,218.0 520,222.0 511.0,226.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="validated" /><text x="450.0" y="178" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">Validated request / TLS</text><polyline points="670,222.0 800,222.0" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="records" /><polygon points="791.0,218.0 800,222.0 791.0,226.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="records" /><text x="735.0" y="178" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">Business records / scoped identity</text><polyline points="595.0,254 595.0,420" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="audit_data" /><polygon points="599.0,411.0 595.0,420 591.0,411.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="audit_data" /><text x="595.0" y="329.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">Redacted event metadata</text><text x="24" y="664" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">Named process/entity/store roles; arrows are classified data flows; dashed frames are trust boundaries</text><text x="24" y="682" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">Example only; not deployed configuration or executable process certification.</text></svg>
