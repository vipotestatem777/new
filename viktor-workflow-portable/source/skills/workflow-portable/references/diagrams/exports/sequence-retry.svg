<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">UML sequence: idempotency and timeout</title><desc id="desc">What happens after a timeout with an uncertain write outcome? | Vertical lifelines; arrows ordered by vertical time; dashed arrows are responses; no duplicate write on retry</desc><metadata>{"model_id": "sequence-retry", "source_sha256": "18354386fa77b0a668f8bdd05e8eb4fa7463391a102a6e064209332047941395", "exporter": "original offline SVG; not a third-party engine render"}</metadata><rect width="1100" height="760" fill="#FFFFFF" /><text x="24" y="29" font-family="Arial, sans-serif" font-size="19" text-anchor="start" fill="#172B4D">UML sequence: idempotency and timeout</text><text x="24" y="51" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">SYNTHETIC REFERENCE | UML sequence</text><rect x="40" y="480" width="990" height="155" fill="none" stroke="#8395AA" /><text x="48" y="496" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#172B4D">Retry after timeout; reconcile outcome, preserve key</text><g data-node-id="caller"><rect x="80" y="100" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="155.0" y="136.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Caller</text><line x1="155.0" x2="155.0" y1="164" y2="675" stroke="#8395AA" stroke-dasharray="5 4" /></g><g data-node-id="api"><rect x="390" y="100" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="465.0" y="136.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">API</text><line x1="465.0" x2="465.0" y1="164" y2="675" stroke="#8395AA" stroke-dasharray="5 4" /></g><g data-node-id="store"><rect x="760" y="100" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="835.0" y="136.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Store</text><line x1="835.0" x2="835.0" y1="164" y2="675" stroke="#8395AA" stroke-dasharray="5 4" /></g><polyline points="155.0,220 465.0,220" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="msg1" /><polygon points="456.0,216.0 465.0,220 456.0,224.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="msg1" /><text x="310.0" y="212.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">1. Create (idempotency key)</text><polyline points="465.0,290 835.0,290" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="msg2" /><polygon points="826.0,286.0 835.0,290 826.0,294.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="msg2" /><text x="650.0" y="282.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">2. Insert-if-absent</text><polyline points="835.0,360 465.0,360" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="msg3" stroke-dasharray="6 4" /><polyline points="474.0,364.0 465.0,360 474.0,356.0" fill="none" stroke="#42526E" stroke-width="1.5" data-arrow-for="msg3" /><text x="650.0" y="352.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">3. Existing or created ID</text><polyline points="465.0,430 155.0,430" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="msg4" stroke-dasharray="6 4" /><polyline points="164.0,434.0 155.0,430 164.0,426.0" fill="none" stroke="#42526E" stroke-width="1.5" data-arrow-for="msg4" /><text x="310.0" y="422.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">4. Response attempt (delivery uncertain)</text><polyline points="155.0,520 465.0,520" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="msg5" /><polygon points="456.0,516.0 465.0,520 456.0,524.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="msg5" /><text x="310.0" y="512.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">5. Retry SAME key</text><polyline points="465.0,590 155.0,590" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="msg6" stroke-dasharray="6 4" /><polyline points="164.0,594.0 155.0,590 164.0,586.0" fill="none" stroke="#42526E" stroke-width="1.5" data-arrow-for="msg6" /><text x="310.0" y="582.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">6. Same resource ID</text><text x="24" y="724" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">Vertical lifelines; arrows ordered by vertical time; dashed arrows are responses; no duplicate write on retry</text><text x="24" y="742" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">Example only; not deployed configuration or executable process certification.</text></svg>
