<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Recovery order and independent gates</title><desc id="desc">Which acceptance gates precede safe restoration? | Dependency arrows are acceptance prerequisites, not a timed execution schedule</desc><metadata>{"model_id": "recovery-dependencies", "source_sha256": "6539dfdc9b76e3c24bcb202cc05c219a2077680fb133f73212aeaa78a8047f17", "exporter": "original offline SVG; not a third-party engine render"}</metadata><rect width="1100" height="700" fill="#FFFFFF" /><text x="24" y="29" font-family="Arial, sans-serif" font-size="19" text-anchor="start" fill="#172B4D">Recovery order and independent gates</text><text x="24" y="51" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">SYNTHETIC REFERENCE | Recovery dependency graph</text><g data-node-id="snapshot"><rect x="60" y="160" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="135.0" y="189.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Snapshot identity</text><text x="135.0" y="204.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">and checksum</text></g><g data-node-id="restore"><rect x="330" y="160" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="405.0" y="189.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Restore isolated</text><text x="405.0" y="204.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">copy</text></g><g data-node-id="integrity"><rect x="610" y="160" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="685.0" y="189.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Integrity / contract</text><text x="685.0" y="204.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">checks</text></g><g data-node-id="accept"><rect x="880" y="160" width="190" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="975.0" y="189.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Owner acceptance</text><text x="975.0" y="204.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">and controlled switch</text></g><g data-node-id="rollback"><rect x="610" y="390" width="150" height="64" rx="8" fill="#EAF1FF" stroke="#344563" stroke-width="1.5" /><text x="685.0" y="419.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">Rollback path</text><text x="685.0" y="434.0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#172B4D">verified before switch</text></g><polyline points="210,192.0 330,192.0" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="snapshot_restore" /><polygon points="321.0,188.0 330,192.0 321.0,196.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="snapshot_restore" /><text x="270.0" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">Verified input</text><polyline points="480,192.0 610,192.0" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="restore_check" /><polygon points="601.0,188.0 610,192.0 601.0,196.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="restore_check" /><text x="545.0" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">No production writes</text><polyline points="760,192.0 880,192.0" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="checks_accept" /><polygon points="871.0,188.0 880,192.0 871.0,196.0" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="checks_accept" /><text x="820.0" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">Acceptance evidence</text><polyline points="760,422.0 880,192.0" fill="none" stroke="#42526E" stroke-width="1.5" data-edge-id="rollback_accept" /><polygon points="872.290566555083,198.128999588709 880,192.0 879.3832453244066,201.82952764226917" fill="#42526E" stroke="#42526E" stroke-width="1.5" data-arrow-for="rollback_accept" /><text x="820.0" y="299.0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#172B4D">Recovery precondition</text><text x="24" y="664" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">Dependency arrows are acceptance prerequisites, not a timed execution schedule</text><text x="24" y="682" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#586B82">Example only; not deployed configuration or executable process certification.</text></svg>
